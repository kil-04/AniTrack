name: Release desktop and native Android

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Require the exact package release tag
        shell: pwsh
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_REF_TYPE -cne "tag") {
            throw "Production releases can only run from a Git tag"
          }
          $package = Get-Content -Raw package.json | ConvertFrom-Json
          if ($package.version -cnotmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "package.json contains an invalid release version"
          }
          $expected = "v$($package.version)"
          if ($env:RELEASE_REF_NAME -cne $expected) {
            throw "Tag $($env:RELEASE_REF_NAME) does not exactly match package version $expected"
          }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Restore permanent Android signing key
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.ANITRACK_ANDROID_KEYSTORE_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_B64)) { throw "Android keystore secret is missing" }
          New-Item -ItemType Directory -Force .release-secrets | Out-Null
          [IO.File]::WriteAllBytes(
            (Join-Path $env:GITHUB_WORKSPACE ".release-secrets\anitrack-next.jks"),
            [Convert]::FromBase64String($env:KEYSTORE_B64)
          )

      - name: Build, verify, upload, then publish one combined release
        env:
          GH_TOKEN: ${{ github.token }}
          ANITRACK_AUTOMATION_PRIVATE_KEY_B64: ${{ secrets.ANITRACK_AUTOMATION_PRIVATE_KEY_B64 }}
          ANITRACK_ANDROID_KEYSTORE_FILE: ../.release-secrets/anitrack-next.jks
          ANITRACK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANITRACK_ANDROID_KEYSTORE_PASSWORD }}
          ANITRACK_ANDROID_KEY_ALIAS: ${{ secrets.ANITRACK_ANDROID_KEY_ALIAS }}
          ANITRACK_ANDROID_KEY_PASSWORD: ${{ secrets.ANITRACK_ANDROID_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npm run release:all
