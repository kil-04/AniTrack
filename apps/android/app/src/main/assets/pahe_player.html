<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  #v { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
</style>
<script src="hls.min.js"></script>
</head>
<body>
<video id="v" playsinline webkit-playsinline></video>
<script>
  var v = document.getElementById('v');
  var hls = null;

  function load(url, startAt, shouldPlay) {
    try {
      startAt = startAt || 0;
      shouldPlay = shouldPlay !== false;
      if (hls) { hls.destroy(); hls = null; }
      if (window.Hls && Hls.isSupported()) {
        // hls.js drives MSE, which tolerates kwik's loosely-muxed TS and seeks
        // cleanly — the exact reason the native decoder couldn't.
        var engine = new Hls({ maxBufferLength: 30, maxMaxBufferLength: 60, lowLatencyMode: false });
        hls = engine;
        var networkRecoveries = 0, mediaRecoveries = 0, stopped = false;
        function stopPlayback(reason) {
          if (stopped || hls !== engine) return;
          stopped = true;
          hls = null;
          v.pause();
          engine.destroy();
          // Fixed categories only: error objects may contain signed URLs.
          if (window.Android) Android.onError(reason);
        }
        engine.on(Hls.Events.MANIFEST_PARSED, function () {
          if (stopped || hls !== engine) return;
          if (startAt > 0) { try { v.currentTime = startAt; } catch (e) {} }
          if (shouldPlay) v.play().catch(function(){}); else v.pause();
        });
        engine.on(Hls.Events.ERROR, function (e, d) {
          if (!d || stopped || hls !== engine) return;
          var status = Number(d.response && d.response.code || d.networkDetails && d.networkDetails.status || 0);
          if (status === 403 || status === 429) { stopPlayback('networkError:accessDenied'); return; }
          if (!d.fatal) return;
          try {
            if (d.type === 'networkError' && networkRecoveries++ < 1) { engine.startLoad(); return; }
            if (d.type === 'mediaError' && mediaRecoveries++ < 1) { engine.recoverMediaError(); return; }
          } catch (x) { /* A failed recovery is terminal until the user taps Retry. */ }
          stopPlayback(d.type === 'mediaError' ? 'mediaError:recoveryFailed' : 'networkError:recoveryFailed');
        });
        // Register handlers before initiating loads; even a synchronous failure
        // must pass through the access-stop and bounded-recovery policy.
        engine.loadSource(url);
        engine.attachMedia(v);
      } else {
        v.src = url;
        v.addEventListener('loadedmetadata', function () { if (startAt > 0) v.currentTime = startAt; }, { once: true });
        if (shouldPlay) v.play().catch(function(){}); else v.pause();
      }
    } catch (e) { if (window.Android) Android.onError(String(e)); }
  }

  function play() { v.play().catch(function(){}); }
  function pause() { v.pause(); }
  function seek(t) { try { v.currentTime = t; } catch (e) {} }
  function rate(r) { v.playbackRate = r; }
  function vol(x) { v.volume = x; }

  // Report state to Kotlin every 300ms.
  setInterval(function () {
    if (!window.Android) return;
    var buf = 0;
    try { if (v.buffered.length) buf = v.buffered.end(v.buffered.length - 1); } catch (e) {}
    Android.onState(v.currentTime || 0, isFinite(v.duration) ? v.duration : 0, v.paused ? 1 : 0, buf);
  }, 300);

  v.addEventListener('ended', function () { if (window.Android) Android.onEnded(); });
</script>
</body>
</html>
